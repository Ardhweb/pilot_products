<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @page {
      size: A4;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      font-family: "Helvetica", "Arial", sans-serif;
      color: #333;
      line-height: 1.4;
    }

    .page {
      width: 210mm;
      height: 297mm;
      position: relative;
      padding: 1.8cm 2cm 1.8cm; /* reduced vertical padding */
      box-sizing: border-box;
      background: #F6F0F0;
      overflow: hidden;
    }

    .top-element, .bottom-element {
      position: absolute;
      width: 100%;
      height: 60px;
      overflow: hidden;
      z-index: 0;
    }

    .top-element {
      top: 1;
    }

    .bottom-element {
      bottom: 0;
      transform: rotate(180deg);
    }

    .top-element svg, .bottom-element svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .header, .section, .footer {
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: left;
      border-bottom: 2px solid black;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      margin: 0;
      font-size: 18pt; /* slightly reduced */
      color: inherit;
    }

    .header p {
      margin: 0.2em 0 0;
      font-size: 10pt; /* slightly reduced */
      color: inherit;
    }

    h2 {
      font-size: 14pt;
      margin-top: 1.2em;
      color: #2c3e50;
    }

    .markdown-content {
      white-space: pre-line;
      font-size: 11pt; /* reduced */
    }

  
  </style>
</head>
<body>
  <div class="top-element">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <rect width="100%" height="100%" fill="#F6F0F0" />
      <path fill="#0099ff" fill-opacity="1" d="M0,64L360,160L720,0L1080,32L1440,128L1440,0L1080,0L720,0L360,0L0,0Z"></path>
    </svg>
  </div>

  <div class="page">
    

    <div class="header">
      <h1>{{name}}</h1>
      <p>{{email}}</p>
    </div>

    <div class="section">
      <div class="markdown-content">
          {{letter.contents}}
      </div>
    </div>
  </div>
  <div class="bottom-element">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <rect width="100%" height="100%" fill="#F6F0F0" />
      <path fill="#0099ff" fill-opacity="1" d="M0,64L360,160L720,0L1080,32L1440,128L1440,0L1080,0L720,0L360,0L0,0Z"></path>
    </svg>
  </div>
</body>
</html>
