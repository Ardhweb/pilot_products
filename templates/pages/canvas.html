<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Canvas</title>
   <style>
    /* General Styles for the Canvas Page */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f1f1f1;
}

/* Canvas Container */
.canvas-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
}

canvas {
    border: 2px solid #ddd;
    background-color: #fff;
}

/* Optional: You can add more controls for the canvas here */
.controls {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 10px;
    color: white;
    border-radius: 5px;
}

   </style>
</head>
<body>
    <div class="canvas-container">
        <!-- This is where the canvas will go -->
        <canvas id="design-canvas" width="800" height="600"></canvas>
    </div>

    <script >
        window.addEventListener('message', function(event) {
    if (event.data.action === 'add-text') {
        addTextToCanvas(event.data.text);
    }
});

// Function to add text on the canvas
function addTextToCanvas(text) {
    const canvas = document.getElementById('design-canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = '30px Arial';
    ctx.fillText(text, 50, 50); // Position text on the canvas
}

    </script>
</body>
</html>
