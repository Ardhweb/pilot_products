{% extends "core/base.html" %}
{% load static %}
{% block title %}
My Letters
{% endblock title %}

{% block content %}
      <div class="container my-4">
    <div class="row">
      {% for item in cover_letters %}
        <div class="col-md-4 mb-4">
          <div class="card">
            <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.name }}">
            <div class="card-body">
              <h5 class="card-title">{{ item.id }}</h5>
              <p class="card-text">{{ item.created_at }}</p>
              <a href="{% url "test_page" l_id=item.id %}">Edit</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
